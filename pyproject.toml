[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-panorama-360-generator"
version = "0.4.2"
description = "AI panorama / 360 generator — diffusion-backed equirectangular and cubemap panorama synthesis with tiled refinement, seam stitching, and depth-aware outpainting."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "panorama-360 maintainers", email = "dev@panorama360.local" }]
keywords = ["panorama", "360", "equirectangular", "diffusion", "cubemap", "vr", "outpainting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics :: 3D Rendering",
]

dependencies = [
  "torch>=2.4,<3.0",
  "torchvision>=0.19",
  "diffusers>=0.30",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "numpy>=1.26",
  "Pillow>=10.3",
  "opencv-python-headless>=4.10",
  "pyvips>=2.2 ; platform_system == 'Linux'",
  "pywin32>=306 ; platform_system == 'Windows'",
  "pydantic>=2.7",
  "typer>=0.12",
  "rich>=13.7",
  "loguru>=0.7",
  "httpx>=0.27",
  "orjson>=3.10",
]

[project.optional-dependencies]
cuda = ["xformers>=0.0.28"]
cpu = []
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
panorama360 = "panorama360.cli:app"

[project.urls]
Homepage = "https://github.com/panorama-360/ai-panorama-360-generator"
Issues = "https://github.com/panorama-360/ai-panorama-360-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["panorama360"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]